# BMFORGE_COMPONENT: bmforge.github-pages; spec_version: 0.1.0
# Shared presentation lives in the remote theme.
remote_theme: "NadimGhaznavi/minimal-mistakes"
minimal_mistakes_skin: "dark"

title: "llamasrv"
title_separator: "-"
name: "llamasrv"
description: "Linux systemd service to run llama-server."
locale: "en-US"
url: "https://llamasrv.osoyalce.com"
baseurl: ""
repository: "NadimGhaznavi/llamasrv"
logo: "/pages/images/llamasrv-logo.png"

mycount:
  endpoint: "https://count.osoyalce.com/count"
  site: "llamasrv"
multilingual:
  enabled: true
  default_lang: en

author:
  name: "Nadim-Daniel Ghaznavi"
  bio: "Creator"
  location: ""
  email: ""
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/NadimGhaznavi"
    - label: "My Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.osoyalce.com/"

footer:
  since: "2026"

include:
  - pages
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - scripts
  - tests
  - templates
  - components
  - skills
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - pyproject.toml
  - package.json
  - package-lock.json
  - .agents
  - .github
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6
sass:
  style: compressed
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      classes: wide
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: wide
      author_profile: true
      read_time: false
      share: true
      related: true
